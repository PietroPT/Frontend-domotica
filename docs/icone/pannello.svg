<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Immagine della persona «Pannello» in Home Assistant: il pannello a muro con le tessere della dashboard.
       Disegno sulla griglia 24 del set di icone (tratto 1,75, duotono), ingrandito 16 volte. -->
  <defs>
    <radialGradient id="sfondo" cx="0" cy="0" r="1.25">
      <stop offset="0" stop-color="#3a2d6b"/>
      <stop offset=".6" stop-color="#1c1838"/>
      <stop offset="1" stop-color="#10243f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sfondo)"/>
  <g transform="translate(64 64) scale(16)">
    <rect x="3" y="5.4" width="18" height="13.2" rx="2.6" fill="#f5f5f7" fill-opacity=".1" stroke="#f5f5f7" stroke-width="1.75"/>
    <rect x="5.9" y="8.3" width="5.6" height="3.3" rx="1" fill="#ffaa1f"/>
    <rect x="12.5" y="8.3" width="5.6" height="3.3" rx="1" fill="#f5f5f7" fill-opacity=".34"/>
    <rect x="5.9" y="12.4" width="5.6" height="3.3" rx="1" fill="#f5f5f7" fill-opacity=".34"/>
    <rect x="12.5" y="12.4" width="5.6" height="3.3" rx="1" fill="#f5f5f7" fill-opacity=".34"/>
  </g>
</svg>
