<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#E9E9EC;font-family:Inter;color:#1c1c1e;padding:36px 40px}
h1{margin:0 0 4px;font-size:34px}p{margin:0 0 22px;font-size:17px;color:#55555b;max-width:1500px}
.r{display:flex;gap:26px;align-items:flex-start}
figure{margin:0}figcaption{font-size:15px;color:#55555b;margin-top:8px;font-weight:500}
.ph img{width:390px;border-radius:28px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.pa img{width:1100px;border-radius:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
</style></head><body><h1 id="t"></h1><p id="d"></p><div class="r" id="r"></div><script>
const q=new URLSearchParams(location.search);
document.getElementById('t').textContent=q.get('title');document.getElementById('d').textContent=q.get('desc');
document.getElementById('r').innerHTML=q.get('imgs').split(';').map(s=>{const [f,c]=s.split('|');return `<figure class="${f.includes('panel')?'pa':'ph'}"><img src="${f}"><figcaption>${c}</figcaption></figure>`}).join('');
</script></body></html>
