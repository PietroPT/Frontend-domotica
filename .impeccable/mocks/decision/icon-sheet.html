<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;background:#f3f5f9;color:#1d2a6b}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;padding:24px}
.c{display:flex;flex-direction:column;align-items:center;gap:6px}
.ico{width:48px;height:48px}.ico .d{fill:currentColor;fill-opacity:.16}
.dark{background:#0d1430;color:#f2c94c}
.s .ico{width:24px;height:24px}
</style></head><body>
<div class="g" id="a"></div><div class="g dark" id="b"></div><div class="g s" id="c"></div>
<script src="icons.js"></script><script>
for (const id of ['a','b','c']) document.getElementById(id).innerHTML = Object.keys(ICONS).map(k=>`<div class="c"><i data-i="${k}"></i><span>${k}</span></div>`).join('');
paintIcons();
</script></body></html>
