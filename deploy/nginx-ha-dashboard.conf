# nginx nell'LXC ha-dashboard: serve i file statici della build, nient'altro.
# Lo copia pubblica.cmd in /etc/nginx/sites-available/ha-dashboard a ogni pubblicazione.
# Nessun proxy verso Home Assistant: il browser parla direttamente con HA (login e WebSocket),
# per questo l'indirizzo di questo LXC va nelle origini CORS di HA.

server {
    # Solo IPv4: in casa IPv6 non è in uso.
    listen 80 default_server;
    server_name _;

    root /var/www/ha-dashboard;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # I file in assets/ hanno un'impronta nel nome e cambiano nome a ogni build:
    # si possono tenere in cache a lungo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html invece va sempre ricontrollato, così una nuova pubblicazione arriva subito.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
