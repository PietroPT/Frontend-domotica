# nginx nell'LXC ha-dashboard: serve i file statici della build e passa /api/ all'archivio
# delle bollette (deploy/bollette.py, solo su 127.0.0.1:8099).
# Lo installa deploy/installa.sh (lanciato da pubblica.cmd) in /etc/nginx/sites-available/ha-dashboard.
# Nessun proxy verso Home Assistant: il browser parla direttamente con HA (login e WebSocket),
# per questo l'indirizzo di questo LXC va nelle origini CORS di HA.

server {
    # Solo IPv4: in casa IPv6 non è in uso.
    listen 80 default_server;
    server_name _;

    root /var/www/ha-dashboard;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Manifest dell'app (Casa e Spese): tipo giusto, sempre ricontrollati come index.html.
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }

    # I file in assets/ hanno un'impronta nel nome e cambiano nome a ogni build:
    # si possono tenere in cache a lungo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Archivio delle bollette: controlla da sé l'accesso con il token di HA della richiesta.
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        client_max_body_size 16k;
        proxy_read_timeout 20s;
        expires -1;
    }

    # index.html invece va sempre ricontrollato, così una nuova pubblicazione arriva subito.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
