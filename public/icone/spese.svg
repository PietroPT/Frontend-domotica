<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icona della sezione Spese salvata sulla schermata Home (scelta di Pietro, 23/10, «moneta sola»):
       gemella di casa.svg, stesso fondo, una moneta indaco con l'euro al centro. Griglia 24 ×13. -->
  <defs>
    <radialGradient id="muro" cx="0" cy="0" r="1.3">
      <stop offset="0" stop-color="#3a2d6b"/>
      <stop offset=".6" stop-color="#1c1838"/>
      <stop offset="1" stop-color="#10243f"/>
    </radialGradient>
    <radialGradient id="luce" cx="256" cy="270" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d7aff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7d7aff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#muro)"/>
  <circle cx="256" cy="270" r="200" fill="url(#luce)"/>
  <circle cx="256" cy="256" r="146" fill="#7d7aff" stroke="#f5f5f7" stroke-width="19"/>
  <g transform="translate(111 100) scale(13)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
    <path d="M15.7 8.3a4.8 4.8 0 1 0 0 7.4M6.6 10.8h6M6.6 13.2h6"/>
